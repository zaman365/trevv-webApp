error_log /dev/stderr notice;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  limit_req_zone $binary_remote_addr zone=trevv_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=trevv_auth:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=trevv_reports:10m rate=10r/m;
  limit_req_status 429;
  map $uri $trevv_route_family {
    default /other;
    /livez /livez;
    /readyz /readyz;
    /topology/log-sentinel /topology/log-sentinel;
    /topology/log-failure-sentinel /topology/log-failure-sentinel;
    ~^/api/v1(?:/|$) /api/v1/:route;
    ~^/api/web(?:/|$) /api/web/:route;
    ~^/api/auth(?:/|$) /api/auth/:route;
    ~^/app(?:/|$) /app/:route;
    ~^/_next/static(?:/|$) /_next/static/:asset;
    ~^/_next/image(?:/|$) /_next/image;
    ~^/(?:privacy|terms|sign-in|sign-up|forgot-password|reset-password|verify-email|invite)(?:/|$) /public/:route;
  }
  log_format trevv_bounded '[$time_local] '
    '"$request_method $trevv_route_family $server_protocol" $status $body_bytes_sent '
    'upstream=$upstream_addr request_id=$request_id';
  access_log /dev/stdout trevv_bounded;
  # Open-source Nginx request-error messages can include the original request
  # line, including its query string, and cannot use a custom bounded format.
  # Discard only HTTP-context error output; main-process lifecycle and config
  # diagnostics continue to use the stderr logger declared above.
  error_log /dev/null debug;
  server_tokens off;

  upstream trevv_api {
    server api-1:8787;
    server api-2:8787;
    keepalive 16;
  }

  upstream trevv_web {
    server web:3000;
    keepalive 8;
  }

  # Internal-only target used to prove that an upstream failure cannot expose
  # query values through Nginx's otherwise unbounded request-error messages.
  upstream trevv_log_failure_sentinel {
    server 127.0.0.1:1;
  }

  server {
    listen 8080;
    server_name _;

    location = /livez {
      access_log off;
      default_type application/json;
      return 200 '{"status":"alive","service":"trevv-proxy"}';
    }

    location = /readyz {
      proxy_pass http://trevv_web/api/web/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /topology/api-readiness {
      proxy_pass http://trevv_api/api/v1/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trevv-Client-IP $remote_addr;
      add_header X-Trevv-Staging-Api-Upstream $upstream_addr always;
    }

    location = /topology/log-sentinel {
      default_type application/json;
      return 204;
    }

    location = /topology/log-failure-sentinel {
      proxy_connect_timeout 1s;
      proxy_read_timeout 1s;
      proxy_pass http://trevv_log_failure_sentinel;
    }

    location / {
      return 404;
    }
  }

  # Private Web/SSR-to-API ingress. It is not published by Compose and only
  # preserves identity headers that the public edge already overwrote.
  server {
    listen 8444 ssl;
    server_name proxy;

    ssl_certificate /etc/trevv-local-tls/tls.crt;
    ssl_certificate_key /etc/trevv-local-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location ^~ /api/ {
      client_max_body_size 128k;
      proxy_pass http://trevv_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $http_x_request_id;
      proxy_set_header X-Trevv-Client-IP $http_x_trevv_client_ip;
      proxy_buffering off;
      proxy_read_timeout 75s;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 8443 ssl;
    server_name _;

    add_header X-Request-ID $request_id always;
    error_page 413 = @json_payload_too_large;
    error_page 429 = @json_rate_limited;

    ssl_certificate /etc/trevv-local-tls/tls.crt;
    ssl_certificate_key /etc/trevv-local-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /livez {
      access_log off;
      default_type application/json;
      return 200 '{"status":"alive","service":"trevv-proxy"}';
    }

    location = /readyz {
      proxy_pass http://trevv_web/api/web/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
    }

    location = /api/web/csp-report {
      client_max_body_size 16k;
      limit_req zone=trevv_reports burst=5 nodelay;
      proxy_pass http://trevv_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trevv-Client-IP $remote_addr;
      proxy_read_timeout 15s;
    }

    location ^~ /api/web/ {
      client_max_body_size 128k;
      limit_req zone=trevv_api burst=60 nodelay;
      proxy_pass http://trevv_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trevv-Client-IP $remote_addr;
      proxy_read_timeout 75s;
    }

    location ^~ /api/auth/ {
      client_max_body_size 64k;
      limit_req zone=trevv_auth burst=10 nodelay;
      # All browser auth crosses the Web allowlist/redaction boundary. Direct
      # Better Auth endpoints can expose session tokens in otherwise valid
      # response shapes and must never be edge-routable.
      proxy_pass http://trevv_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trevv-Client-IP $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 75s;
    }

    location ^~ /api/ {
      client_max_body_size 128k;
      limit_req zone=trevv_api burst=60 nodelay;
      proxy_pass http://trevv_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trevv-Client-IP $remote_addr;
      proxy_buffering off;
      proxy_read_timeout 75s;
    }

    location / {
      client_max_body_size 128k;
      proxy_pass http://trevv_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Trevv-Client-IP $remote_addr;
      proxy_read_timeout 75s;
    }

    location @json_payload_too_large {
      internal;
      default_type application/json;
      return 413 '{"error":{"code":"payload_too_large","message":"The request is too large.","requestId":"$request_id"}}';
    }

    location @json_rate_limited {
      internal;
      default_type application/json;
      return 429 '{"error":{"code":"rate_limited","message":"Retry this request later.","requestId":"$request_id"}}';
    }
  }
}
