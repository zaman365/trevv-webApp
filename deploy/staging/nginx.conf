worker_processes auto;

events {
  worker_connections 1024;
}

http {
  log_format trevv_no_query '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'upstream=$upstream_addr request_id=$request_id';
  access_log /dev/stdout trevv_no_query;
  error_log /dev/stderr warn;
  server_tokens off;

  upstream trevv_api {
    server api-1:8787;
    server api-2:8787;
    keepalive 16;
  }

  upstream trevv_web {
    server web:3000;
    keepalive 8;
  }

  server {
    listen 8080;
    server_name _;

    location = /livez {
      access_log off;
      default_type application/json;
      return 200 '{"status":"alive","service":"trevv-proxy"}';
    }

    location = /readyz {
      proxy_pass http://trevv_web/api/web/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
    }

    location = /topology/api-readiness {
      proxy_pass http://trevv_api/api/v1/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      add_header X-Trevv-Staging-Api-Upstream $upstream_addr always;
    }

    location = /topology/log-sentinel {
      default_type application/json;
      return 204;
    }

    location / {
      return 404;
    }
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate /etc/trevv-local-tls/tls.crt;
    ssl_certificate_key /etc/trevv-local-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    location = /livez {
      access_log off;
      default_type application/json;
      return 200 '{"status":"alive","service":"trevv-proxy"}';
    }

    location = /readyz {
      proxy_pass http://trevv_web/api/web/readyz;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /api/web/ {
      proxy_pass http://trevv_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
    }

    location ^~ /api/ {
      proxy_pass http://trevv_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 75s;
    }

    location / {
      proxy_pass http://trevv_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Host 127.0.0.1:8443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 75s;
    }
  }
}
