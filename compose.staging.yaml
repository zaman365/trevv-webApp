x-runtime-build: &runtime-build
  context: .
  dockerfile: Dockerfile.staging
  args:
    STAGING_PUBLIC_ORIGIN: https://127.0.0.1:8443

x-api-environment: &api-environment
  NODE_ENV: test
  DEMO_MODE: "false"
  PORT: "8787"
  DATABASE_URL: postgresql://founderhq:founderhq@postgres:5432/founderhq
  BETTER_AUTH_SECRET: staging-ci-only-secret-with-more-than-32-characters
  BETTER_AUTH_URL: https://127.0.0.1:8443
  WEB_ORIGIN: https://127.0.0.1:8443
  MAIL_FROM: no-reply@trevv.test
  MAIL_SINK_FILE: /tmp/trevv-staging/mail.jsonl

x-api-service: &api-service
  build:
    <<: *runtime-build
    target: api
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
    mail-init:
      condition: service_completed_successfully
  environment: *api-environment
  volumes:
    - staging-mail:/tmp/trevv-staging
  healthcheck:
    test: ["CMD", "node", "scripts/api-readiness.mjs"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 10s

x-worker-environment: &worker-environment
  NODE_ENV: test
  DEMO_MODE: "false"
  DATABASE_URL: postgresql://founderhq:founderhq@postgres:5432/founderhq
  WORKER_ENABLED: "true"
  WORKER_HEALTH_HOST: 0.0.0.0
  WORKER_HEALTH_PORT: "9090"
  WORKER_BATCH_SIZE: "5"
  WORKER_CONCURRENCY: "5"
  WORKER_POLL_INTERVAL_MS: "250"
  WORKER_TELEMETRY_INTERVAL_MS: "1000"
  WORKER_READINESS_MAX_UNSUPPORTED_AGE_MS: "5000"

x-worker-service: &worker-service
  build:
    <<: *runtime-build
    target: worker
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: *worker-environment
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:9090/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  tls-init:
    build:
      <<: *runtime-build
      target: tls-init
    restart: "no"
    volumes:
      - staging-tls:/tls

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: founderhq
      POSTGRES_PASSWORD: founderhq
      POSTGRES_DB: founderhq
    volumes:
      - staging-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderhq -d founderhq"]
      interval: 5s
      timeout: 5s
      retries: 20

  mail-init:
    image: alpine:3.22
    restart: "no"
    command:
      - sh
      - -euc
      - >-
        install -d -o 1000 -g 1000 -m 0700 /mail;
        : > /mail/mail.jsonl;
        chown 1000:1000 /mail/mail.jsonl;
        chmod 0600 /mail/mail.jsonl
    volumes:
      - staging-mail:/mail

  migrate:
    build:
      <<: *runtime-build
      target: migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://founderhq:founderhq@postgres:5432/founderhq

  api-1:
    <<: *api-service

  api-2:
    <<: *api-service

  worker-1:
    <<: *worker-service
    environment:
      <<: *worker-environment
      WORKER_ID: staging-worker-1

  worker-2:
    <<: *worker-service
    environment:
      <<: *worker-environment
      WORKER_ID: staging-worker-2

  web:
    build:
      <<: *runtime-build
      target: web
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEMO_MODE: "false"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      API_ORIGIN: https://proxy:8443
      NEXT_PUBLIC_APP_URL: https://127.0.0.1:8443
    volumes:
      - staging-tls:/etc/trevv-local-tls:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/web/readyz').then(async r=>{const b=await r.json();process.exit(r.ok&&b.status==='ready'&&b.api==='ready'?0:1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  proxy:
    build:
      <<: *runtime-build
      target: proxy
    restart: unless-stopped
    depends_on:
      tls-init:
        condition: service_completed_successfully
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "8443:8443"
    volumes:
      - staging-tls:/etc/trevv-local-tls:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  smoke:
    profiles: ["smoke"]
    build:
      <<: *runtime-build
      target: smoke
    depends_on:
      proxy:
        condition: service_healthy
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
    environment:
      NODE_EXTRA_CA_CERTS: /etc/trevv-local-tls/ca.crt
      STAGING_ORIGIN: https://proxy:8443
      STAGING_PUBLIC_ORIGIN: https://127.0.0.1:8443
      STAGING_INTERNAL_PROXY_ORIGIN: http://proxy:8080
      DATABASE_URL: postgresql://founderhq:founderhq@postgres:5432/founderhq
      MAIL_SINK_FILE: /tmp/trevv-staging/mail.jsonl
    volumes:
      - staging-mail:/tmp/trevv-staging:ro
      - staging-tls:/etc/trevv-local-tls:ro

  upgrade-smoke:
    profiles: ["smoke"]
    build:
      <<: *runtime-build
      target: upgrade-smoke
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STAGING_DATABASE_ADMIN_URL: postgresql://founderhq:founderhq@postgres:5432/postgres
      STAGING_UPGRADE_DATABASE: trevv_previous_release_upgrade
      STAGING_PREVIOUS_MIGRATION: 0008_lumpy_sasquatch.sql

volumes:
  staging-mail:
  staging-postgres:
  staging-tls:
