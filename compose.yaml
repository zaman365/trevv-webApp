services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: founderhq
      POSTGRES_PASSWORD: founderhq
      POSTGRES_DB: founderhq
    ports:
      - "5432:5432"
    volumes:
      - founderhq-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U founderhq -d founderhq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  founderhq-postgres:
