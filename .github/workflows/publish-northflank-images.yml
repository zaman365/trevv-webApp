name: Publish Northflank images
run-name: Northflank images for ${{ github.sha }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: northflank-image-publication-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-source:
    name: Verify exact source and complete CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Verify the selected commit passed every CI gate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          successful_runs=$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=${GITHUB_SHA}" -f status=completed -f per_page=100 \
            --jq '[.workflow_runs[] | select(.event == "push" and .conclusion == "success")] | length')
          if [ "$successful_runs" -ge 1 ]; then
            test "$successful_runs" -ge 1
          else
            node scripts/verify-navigation-retry.mjs publication
          fi
          echo "source_sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
  build-images:
    name: Build and push ${{ matrix.target }}
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            docker_target: web
          - target: api
            docker_target: api
          - target: worker
            docker_target: worker
          - target: migrate
            docker_target: remote-migrate
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Check out the verified source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checkout is exact and clean
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Define a unique candidate image reference
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/trevv-${TARGET}"
          tag="northflank-unverified-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=${name}:${tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push the uniquely tagged unverified candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.staging
          target: ${{ matrix.docker_target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-source.outputs.source_sha }}
            org.opencontainers.image.title=trevv-${{ matrix.target }}
          build-args: |
            STAGING_PUBLIC_ORIGIN=https://trevv.de
            STAGING_CSP_MODE=report-only
            STAGING_HSTS_ENABLED=false
          cache-from: type=gha,scope=staging-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.target }}
          provenance: mode=max
          sbom: true
      - name: Verify the exact pushed registry digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          test -n "$IMAGE_DIGEST"
          mkdir -p artifacts
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            > "artifacts/${{ matrix.target }}.oci-manifest.json"
      - name: Record unverified candidate metadata
        env:
          CSP_MODE: report-only
          HSTS_ENABLED: "false"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PUBLIC_ORIGIN: https://trevv.de
          TARGET: ${{ matrix.target }}
        run: |
          jq -n \
            --arg target "$TARGET" \
            --arg image "$IMAGE_NAME" \
            --arg tag "$IMAGE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg publicOrigin "$PUBLIC_ORIGIN" \
            --arg cspMode "$CSP_MODE" \
            --arg hstsEnabled "$HSTS_ENABLED" \
            '{
              target: $target,
              image: $image,
              tag: $tag,
              digest: $digest,
              reference: ($image + "@" + $digest),
              sourceSha: $sourceSha,
              platform: "linux/amd64",
              build: {
                publicOrigin: $publicOrigin,
                cspMode: $cspMode,
                hstsEnabled: ($hstsEnabled == "true")
              },
              verification: {
                status: "unverified",
                requiredGates: ["syft-spdx", "grype-high-critical"],
                githubProvenanceIssued: false
              }
            }' > "artifacts/${TARGET}.manifest.json"
      - name: Remove the package-write registry credential
        run: docker logout ghcr.io
      - name: Upload unverified build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: northflank-image-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  scan-images:
    name: Scan ${{ matrix.target }}
    needs: [verify-source, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, worker, migrate]
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Download unverified build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: northflank-image-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Validate candidate metadata and prepare isolated Docker credentials
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          manifest="artifacts/${TARGET}.manifest.json"
          test "$(jq -r '.target' "$manifest")" = "$TARGET"
          test "$(jq -r '.sourceSha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.verification.status' "$manifest")" = "unverified"
          image_name=$(jq -r '.image' "$manifest")
          image_digest=$(jq -r '.digest' "$manifest")
          printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$(jq -r '.reference' "$manifest")" = "${image_name}@${image_digest}"
          scan_docker_config="${RUNNER_TEMP}/trevv-scan-docker-config"
          mkdir -p "$scan_docker_config"
          echo "DOCKER_CONFIG=$scan_docker_config" >> "$GITHUB_ENV"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "local_reference=trevv-local-${TARGET}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with package-read access
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Load the exact pushed image locally
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          LOCAL_IMAGE: ${{ steps.image.outputs.local_reference }}
        run: |
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_NAME}@${IMAGE_DIGEST}" "$LOCAL_IMAGE"
          docker image inspect "$LOCAL_IMAGE" >/dev/null
      - name: Remove usable registry credentials before security tools run
        run: |
          docker logout ghcr.io
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          test "$(jq '.auths | length' "$DOCKER_CONFIG/config.json")" -eq 0
      - name: Generate an explicit SPDX JSON SBOM from the local image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.local_reference }}
          format: spdx-json
          output-file: artifacts/${{ matrix.target }}.sbom.spdx.json
          upload-artifact: false
      - name: Scan the local image for high and critical vulnerabilities
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          image: ${{ steps.image.outputs.local_reference }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: artifacts/${{ matrix.target }}.vulnerabilities.sarif
      - name: Mark the candidate security gates as passed
        env:
          TARGET: ${{ matrix.target }}
        run: |
          jq \
            '.verification.status = "security-gates-passed" |
             .verification.githubProvenanceIssued = false' \
            "artifacts/${TARGET}.manifest.json" > "artifacts/${TARGET}.manifest.tmp.json"
          mv "artifacts/${TARGET}.manifest.tmp.json" "artifacts/${TARGET}.manifest.json"
      - name: Upload security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: northflank-image-scan-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  attest-images:
    name: Attest verified ${{ matrix.target }} image
    needs: [verify-source, scan-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, worker, migrate]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Download passed security evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: northflank-image-scan-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Validate the exact attestation subject
        id: subject
        env:
          TARGET: ${{ matrix.target }}
        run: |
          manifest="evidence/${TARGET}.manifest.json"
          test "$(jq -r '.target' "$manifest")" = "$TARGET"
          test "$(jq -r '.sourceSha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.verification.status' "$manifest")" = "security-gates-passed"
          image_name=$(jq -r '.image' "$manifest")
          image_digest=$(jq -r '.digest' "$manifest")
          printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$(jq -r '.reference' "$manifest")" = "${image_name}@${image_digest}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
      # actions/attest reads the runner's default Docker config. This dedicated
      # job exposes it only for the immediately following attestation step and
      # scrubs it before any evidence is processed or uploaded.
      - name: Log in to GHCR for registry attestation
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create GitHub provenance for the exact verified image
        id: attest
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true
      - name: Remove the registry attestation credential
        if: ${{ always() }}
        run: |
          docker logout ghcr.io || true
          install -d -m 0700 "${HOME}/.docker"
          printf '{"auths":{}}\n' > "${HOME}/.docker/config.json"
          chmod 0600 "${HOME}/.docker/config.json"
          test "$(jq '.auths | length' "${HOME}/.docker/config.json")" -eq 0
      - name: Record provenance in the verified image metadata
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          TARGET: ${{ matrix.target }}
        run: |
          test -f "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" "evidence/${TARGET}.provenance.bundle.json"
          jq \
            --arg attestationUrl "$ATTESTATION_URL" \
            '.verification.status = "attested-security-gates-passed" |
             .verification.githubProvenanceIssued = true |
             .provenance = {url: $attestationUrl}' \
            "evidence/${TARGET}.manifest.json" > "evidence/${TARGET}.manifest.tmp.json"
          mv "evidence/${TARGET}.manifest.tmp.json" "evidence/${TARGET}.manifest.json"
      - name: Upload attested image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: northflank-image-attested-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    name: Collect verified Northflank release images
    needs: [verify-source, attest-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: northflank-image-attested-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          merge-multiple: true
      - name: Bind the four verified images to one source release
        env:
          SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
        run: |
          for target in web api worker migrate; do
            jq -e --arg source "$SOURCE_SHA" --arg target "$target" '
              .sourceSha == $source and .target == $target and
              .verification.status == "attested-security-gates-passed" and
              .verification.githubProvenanceIssued == true and
              (.digest | test("^sha256:[0-9a-f]{64}$"))
            ' "evidence/${target}.manifest.json"
          done
          jq -s --arg source "$SOURCE_SHA" \
            --arg release "northflank-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            '{releaseId: $release, sourceSha: $source, deploymentPerformed: false,
              images: (map({key: .target, value: .}) | from_entries)}' \
            evidence/web.manifest.json evidence/api.manifest.json \
            evidence/worker.manifest.json evidence/migrate.manifest.json \
            > evidence/northflank-release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: northflank-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 30
