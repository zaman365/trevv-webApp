name: Publish staging images

run-name: Publish staging images for ${{ inputs.source_sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Optional full SHA; it must equal this workflow's branch commit
        required: false
        default: ""
        type: string
      public_origin:
        description: Public HTTPS origin compiled into the Web image
        required: true
        default: https://alpha.trevv.de
        type: string
      csp_mode:
        description: Fixed report-only CSP for this disposable free preview
        required: true
        default: report-only
        type: choice
        options:
          - report-only
      hsts_enabled:
        description: Fixed HSTS-off policy for this disposable free preview
        required: true
        default: "false"
        type: choice
        options:
          - "false"
      previous_artifact_id:
        description: GitHub artifact ID for the currently deployed predecessor publication
        required: true
        default: ""
        type: string
      previous_artifact_sha256:
        description: SHA-256 of the exact deployed predecessor artifact ZIP
        required: true
        default: ""
        type: string
      previous_manifest_sha256:
        description: SHA-256 of the exact predecessor manifest file bytes
        required: true
        default: ""
        type: string
      successor_confirmation:
        description: Type publish-successor-from-deployed:<candidate-sha>:<previous-manifest-sha256>
        required: true
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: staging-image-publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    name: Verify remote source and CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Require the publication workflow from trevv-foundation
        run: test "$GITHUB_REF" = "refs/heads/trevv-foundation"
      - name: Check out remote history only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and verify the source commit
        id: source
        env:
          CSP_MODE: ${{ inputs.csp_mode }}
          HSTS_ENABLED: ${{ inputs.hsts_enabled }}
          PREVIOUS_ARTIFACT_ID: ${{ inputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_SHA256: ${{ inputs.previous_artifact_sha256 }}
          PREVIOUS_MANIFEST_SHA256: ${{ inputs.previous_manifest_sha256 }}
          PUBLIC_ORIGIN: ${{ inputs.public_origin }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          SUCCESSOR_CONFIRMATION: ${{ inputs.successor_confirmation }}
        run: |
          source_sha="${REQUESTED_SOURCE_SHA:-$GITHUB_SHA}"
          if ! printf '%s' "$source_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::source_sha must be a full lowercase 40-character Git commit SHA."
            exit 1
          fi
          node -e '
            const origin = new URL(process.env.PUBLIC_ORIGIN);
            if (origin.protocol !== "https:" || origin.username || origin.password ||
                origin.pathname !== "/" || origin.search || origin.hash) {
              throw new Error("public_origin must be a credential-free HTTPS origin without a path, query, or fragment");
            }
            if (origin.origin !== "https://alpha.trevv.de") {
              throw new Error("public_origin must equal the checked-in alpha Web origin");
            }
          '
          if [ "$CSP_MODE" != "report-only" ] || [ "$HSTS_ENABLED" != "false" ]; then
            echo "::error::The disposable free preview requires csp_mode=report-only and hsts_enabled=false."
            exit 1
          fi
          if ! printf '%s' "$PREVIOUS_ARTIFACT_ID" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::previous_artifact_id must be a positive GitHub artifact ID."
            exit 1
          fi
          for digest in "$PREVIOUS_ARTIFACT_SHA256" "$PREVIOUS_MANIFEST_SHA256"; do
            if ! printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "::error::Predecessor digests must be lowercase sha256 values."
              exit 1
            fi
          done
          expected_confirmation="publish-successor-from-deployed:${source_sha}:${PREVIOUS_MANIFEST_SHA256}"
          if [ "$SUCCESSOR_CONFIRMATION" != "$expected_confirmation" ]; then
            echo "::error::successor_confirmation does not bind this candidate to the deployed predecessor manifest."
            exit 1
          fi
          test "$(git rev-parse origin/trevv-foundation)" = "$GITHUB_SHA"
          git cat-file -e "${source_sha}^{commit}"
          if [ "$source_sha" != "$GITHUB_SHA" ]; then
            echo "::error::source_sha must exactly equal the trevv-foundation workflow commit."
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Require a successful complete CI run for the exact source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          successful_runs=$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "head_sha=${SOURCE_SHA}" \
            -f status=completed \
            -f per_page=20 \
            --jq '[.workflow_runs[] | select(
              .event == "push" and
              .head_branch == "trevv-foundation" and
              .conclusion == "success"
            )] | length')
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::No successful TREVV CI run exists for ${SOURCE_SHA}."
            exit 1
          fi

  build-images:
    name: Build and push ${{ matrix.target }}
    needs: verify-source
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            docker_target: web
          - target: api
            docker_target: api
          - target: worker
            docker_target: worker
          - target: migrate
            docker_target: remote-migrate
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Check out the verified source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checkout is exact and clean
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Define a unique candidate image reference
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          name="ghcr.io/${owner}/trevv-${TARGET}"
          tag="unverified-candidate-${SOURCE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "reference=${name}:${tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push the uniquely tagged unverified candidate
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: Dockerfile.staging
          target: ${{ matrix.docker_target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify-source.outputs.source_sha }}
            org.opencontainers.image.title=trevv-${{ matrix.target }}
          build-args: |
            STAGING_PUBLIC_ORIGIN=${{ inputs.public_origin }}
            STAGING_CSP_MODE=${{ inputs.csp_mode }}
            STAGING_HSTS_ENABLED=${{ inputs.hsts_enabled }}
          cache-from: type=gha,scope=staging-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.target }}
          provenance: mode=max
          sbom: true
      - name: Verify the exact pushed registry digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          test -n "$IMAGE_DIGEST"
          mkdir -p artifacts
          docker buildx imagetools inspect --raw "${IMAGE_NAME}@${IMAGE_DIGEST}" \
            > "artifacts/${{ matrix.target }}.oci-manifest.json"
      - name: Record unverified candidate metadata
        env:
          CSP_MODE: ${{ inputs.csp_mode }}
          HSTS_ENABLED: ${{ inputs.hsts_enabled }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          PUBLIC_ORIGIN: ${{ inputs.public_origin }}
          TARGET: ${{ matrix.target }}
        run: |
          jq -n \
            --arg target "$TARGET" \
            --arg image "$IMAGE_NAME" \
            --arg tag "$IMAGE_TAG" \
            --arg digest "$IMAGE_DIGEST" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg publicOrigin "$PUBLIC_ORIGIN" \
            --arg cspMode "$CSP_MODE" \
            --arg hstsEnabled "$HSTS_ENABLED" \
            '{
              target: $target,
              image: $image,
              tag: $tag,
              digest: $digest,
              reference: ($image + "@" + $digest),
              sourceSha: $sourceSha,
              platform: "linux/amd64",
              build: {
                publicOrigin: $publicOrigin,
                cspMode: $cspMode,
                hstsEnabled: ($hstsEnabled == "true")
              },
              verification: {
                status: "unverified",
                requiredGates: ["syft-spdx", "grype-high-critical"],
                githubProvenanceIssued: false
              }
            }' > "artifacts/${TARGET}.manifest.json"
      - name: Remove the package-write registry credential
        run: docker logout ghcr.io
      - name: Upload unverified build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-image-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  scan-images:
    name: Scan ${{ matrix.target }}
    needs: [verify-source, build-images]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, worker, migrate]
    permissions:
      contents: read
      packages: read
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Download unverified build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-image-build-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
      - name: Validate candidate metadata and prepare isolated Docker credentials
        id: image
        env:
          TARGET: ${{ matrix.target }}
        run: |
          manifest="artifacts/${TARGET}.manifest.json"
          test "$(jq -r '.target' "$manifest")" = "$TARGET"
          test "$(jq -r '.sourceSha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.verification.status' "$manifest")" = "unverified"
          image_name=$(jq -r '.image' "$manifest")
          image_digest=$(jq -r '.digest' "$manifest")
          printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$(jq -r '.reference' "$manifest")" = "${image_name}@${image_digest}"
          scan_docker_config="${RUNNER_TEMP}/trevv-scan-docker-config"
          mkdir -p "$scan_docker_config"
          echo "DOCKER_CONFIG=$scan_docker_config" >> "$GITHUB_ENV"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
          echo "local_reference=trevv-local-${TARGET}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR with package-read access
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Load the exact pushed image locally
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          LOCAL_IMAGE: ${{ steps.image.outputs.local_reference }}
        run: |
          docker pull --platform linux/amd64 "${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker tag "${IMAGE_NAME}@${IMAGE_DIGEST}" "$LOCAL_IMAGE"
          docker image inspect "$LOCAL_IMAGE" >/dev/null
      - name: Remove usable registry credentials before security tools run
        run: |
          docker logout ghcr.io
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          test "$(jq '.auths | length' "$DOCKER_CONFIG/config.json")" -eq 0
      - name: Generate an explicit SPDX JSON SBOM from the local image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.local_reference }}
          format: spdx-json
          output-file: artifacts/${{ matrix.target }}.sbom.spdx.json
          upload-artifact: false
      - name: Scan the local image for high and critical vulnerabilities
        uses: anchore/scan-action@0d444ed77d83ee2ba7f5ced0d90d640a1281d762 # v7.3.0
        with:
          image: ${{ steps.image.outputs.local_reference }}
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: artifacts/${{ matrix.target }}.vulnerabilities.sarif
      - name: Mark the candidate security gates as passed
        env:
          TARGET: ${{ matrix.target }}
        run: |
          jq \
            '.verification.status = "security-gates-passed" |
             .verification.githubProvenanceIssued = false' \
            "artifacts/${TARGET}.manifest.json" > "artifacts/${TARGET}.manifest.tmp.json"
          mv "artifacts/${TARGET}.manifest.tmp.json" "artifacts/${TARGET}.manifest.json"
      - name: Upload security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-image-scan-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 30

  attest-images:
    name: Attest verified ${{ matrix.target }} image
    needs: [verify-source, scan-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [web, api, worker, migrate]
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Download passed security evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: staging-image-scan-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
      - name: Validate the exact attestation subject
        id: subject
        env:
          TARGET: ${{ matrix.target }}
        run: |
          manifest="evidence/${TARGET}.manifest.json"
          test "$(jq -r '.target' "$manifest")" = "$TARGET"
          test "$(jq -r '.sourceSha' "$manifest")" = "$SOURCE_SHA"
          test "$(jq -r '.verification.status' "$manifest")" = "security-gates-passed"
          image_name=$(jq -r '.image' "$manifest")
          image_digest=$(jq -r '.digest' "$manifest")
          printf '%s' "$image_digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          test "$(jq -r '.reference' "$manifest")" = "${image_name}@${image_digest}"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"
      # actions/attest reads the runner's default Docker config. This dedicated
      # job exposes it only for the immediately following attestation step and
      # scrubs it before any evidence is processed or uploaded.
      - name: Log in to GHCR for registry attestation
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create GitHub provenance for the exact verified image
        id: attest
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-name: ${{ steps.subject.outputs.name }}
          subject-digest: ${{ steps.subject.outputs.digest }}
          push-to-registry: true
      - name: Remove the registry attestation credential
        if: ${{ always() }}
        run: |
          docker logout ghcr.io || true
          install -d -m 0700 "${HOME}/.docker"
          printf '{"auths":{}}\n' > "${HOME}/.docker/config.json"
          chmod 0600 "${HOME}/.docker/config.json"
          test "$(jq '.auths | length' "${HOME}/.docker/config.json")" -eq 0
      - name: Record provenance in the verified image metadata
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          TARGET: ${{ matrix.target }}
        run: |
          test -f "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" "evidence/${TARGET}.provenance.bundle.json"
          jq \
            --arg attestationUrl "$ATTESTATION_URL" \
            '.verification.status = "attested-security-gates-passed" |
             .verification.githubProvenanceIssued = true |
             .provenance = {url: $attestationUrl}' \
            "evidence/${TARGET}.manifest.json" > "evidence/${TARGET}.manifest.tmp.json"
          mv "evidence/${TARGET}.manifest.tmp.json" "evidence/${TARGET}.manifest.json"
      - name: Upload attested image evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-image-attested-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  digest-bundle:
    name: Publish digest bundle and successor manifest
    needs: [verify-source, attest-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.verify-source.outputs.source_sha }}
    steps:
      - name: Check out the exact verified source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.verify-source.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the manifest-declared Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Verify the manifest source worktree is exact and clean
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/staging-evidence" "$RUNNER_TEMP/staging-publication"
      - name: Set up Docker Buildx for deployed-predecessor availability checks
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Authenticate the selected deployed predecessor
        id: predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ARTIFACT_ID: ${{ inputs.previous_artifact_id }}
          PREVIOUS_ARTIFACT_SHA256: ${{ inputs.previous_artifact_sha256 }}
          PREVIOUS_MANIFEST_SHA256: ${{ inputs.previous_manifest_sha256 }}
        run: |
          predecessor_root="$RUNNER_TEMP/staging-predecessor"
          predecessor_archive="$predecessor_root/publication.zip"
          predecessor_files="$predecessor_root/files"
          artifact_metadata="$predecessor_root/artifact.json"
          run_metadata="$predecessor_root/run.json"
          predecessor_report="$predecessor_root/verified-deployed-predecessor.json"
          mkdir -p "$predecessor_files"

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREVIOUS_ARTIFACT_ID}" \
            > "$artifact_metadata"
          previous_run_id=$(jq -er \
            '.workflow_run.id | select(type == "number" and . > 0)' \
            "$artifact_metadata")
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}" \
            > "$run_metadata"
          previous_source_sha=$(jq -er \
            '.head_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' \
            "$run_metadata")
          git cat-file -e "${previous_source_sha}^{commit}"
          predecessor_migration_tree=$(git rev-parse \
            "${previous_source_sha}:packages/db/migrations")
          candidate_migration_tree=$(git rev-parse \
            "${SOURCE_SHA}:packages/db/migrations")

          gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PREVIOUS_ARTIFACT_ID}/zip" \
            > "$predecessor_archive"
          archive_digest="sha256:$(sha256sum "$predecessor_archive" | cut -d ' ' -f 1)"
          if [ "$archive_digest" != "$PREVIOUS_ARTIFACT_SHA256" ]; then
            echo "::error::The downloaded predecessor artifact digest is not the confirmed digest."
            exit 1
          fi
          unzip -tqq "$predecessor_archive"
          expected_inventory=$(printf '%s\n' \
            staging-image-digests.json \
            staging-image-digests.provenance.bundle.json \
            staging-publication-attestations.json \
            staging-release-manifest.json \
            staging-release-manifest.provenance.bundle.json)
          actual_inventory=$(unzip -Z1 "$predecessor_archive" | LC_ALL=C sort)
          if [ "$actual_inventory" != "$expected_inventory" ]; then
            echo "::error::The predecessor publication has an unexpected file inventory."
            exit 1
          fi
          unzip -q "$predecessor_archive" -d "$predecessor_files"

          previous_manifest="$predecessor_files/staging-release-manifest.json"
          manifest_digest="sha256:$(sha256sum "$previous_manifest" | cut -d ' ' -f 1)"
          if [ "$manifest_digest" != "$PREVIOUS_MANIFEST_SHA256" ]; then
            echo "::error::The predecessor manifest raw-byte digest is not the confirmed digest."
            exit 1
          fi

          node scripts/staging-publication-predecessor.mjs \
            --artifact-metadata "$artifact_metadata" \
            --run-metadata "$run_metadata" \
            --archive "$predecessor_archive" \
            --manifest "$previous_manifest" \
            --digest-bundle "$predecessor_files/staging-image-digests.json" \
            --migration-journal packages/db/migrations/meta/_journal.json \
            --artifact-id "$PREVIOUS_ARTIFACT_ID" \
            --artifact-sha256 "$PREVIOUS_ARTIFACT_SHA256" \
            --manifest-sha256 "$PREVIOUS_MANIFEST_SHA256" \
            --candidate-sha "$SOURCE_SHA" \
            --predecessor-migration-tree "$predecessor_migration_tree" \
            --candidate-migration-tree "$candidate_migration_tree" \
            --repository "$GITHUB_REPOSITORY" \
            > "$predecessor_report"

          previous_sha=$(jq -er '.publication.sourceSha' "$predecessor_report")
          test "$previous_sha" = "$previous_source_sha"
          previous_release_id=$(jq -er '.publication.releaseId' "$predecessor_report")
          published_migration_head=$(jq -er \
            '.publication.publishedMigrationHead' "$predecessor_report")
          candidate_migration_head=$(jq -er \
            '.migrationPolicy.candidateHead' "$predecessor_report")
          test "$published_migration_head" = "$candidate_migration_head"
          test "$(jq -er '.migrationPolicy.predecessorMigrationTreeId' \
            "$predecessor_report")" = "$candidate_migration_tree"

          git cat-file -e "${previous_sha}^{commit}"
          if ! git merge-base --is-ancestor "$previous_sha" "$SOURCE_SHA"; then
            echo "::error::The authenticated deployed predecessor is not an ancestor of the candidate source."
            exit 1
          fi

          signer_workflow="${GITHUB_REPOSITORY}/.github/workflows/publish-staging-images.yml"
          gh attestation verify "$previous_manifest" \
            --bundle "$predecessor_files/staging-release-manifest.provenance.bundle.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/trevv-foundation \
            --source-digest "$previous_sha" \
            --deny-self-hosted-runners
          gh attestation verify "$predecessor_files/staging-image-digests.json" \
            --bundle "$predecessor_files/staging-image-digests.provenance.bundle.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$signer_workflow" \
            --source-ref refs/heads/trevv-foundation \
            --source-digest "$previous_sha" \
            --deny-self-hosted-runners

          predecessor_docker_config="$RUNNER_TEMP/trevv-predecessor-docker-config"
          install -d -m 0700 "$predecessor_docker_config"
          printf '{"auths":{}}\n' > "$predecessor_docker_config/config.json"
          chmod 0600 "$predecessor_docker_config/config.json"
          for service in api migrate web worker; do
            reference=$(jq -r ".images.${service}.reference" \
              "$predecessor_files/staging-image-digests.json")
            DOCKER_CONFIG="$predecessor_docker_config" \
              docker buildx imagetools inspect "$reference" >/dev/null
          done

          {
            printf '### Authenticated predecessor readiness\n\n```json\n'
            jq '{
              publication,
              readinessReportedCohort,
              migrationPolicy,
              databaseState,
              deploymentState,
              readinessObservedAt
            }' "$predecessor_report"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "manifest_path=$previous_manifest" >> "$GITHUB_OUTPUT"
          echo "manifest_sha256=$manifest_digest" >> "$GITHUB_OUTPUT"
          echo "published_migration_head=$published_migration_head" >> "$GITHUB_OUTPUT"
          echo "release_id=$previous_release_id" >> "$GITHUB_OUTPUT"
          echo "source_sha=$previous_sha" >> "$GITHUB_OUTPUT"
      - name: Download service evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: staging-image-attested-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-evidence
          merge-multiple: true
      - name: Assemble the machine-readable digest bundle
        env:
          CSP_MODE: ${{ inputs.csp_mode }}
          EVIDENCE_DIR: ${{ runner.temp }}/staging-evidence
          HSTS_ENABLED: ${{ inputs.hsts_enabled }}
          OUTPUT_DIR: ${{ runner.temp }}/staging-publication
          PUBLIC_ORIGIN: ${{ inputs.public_origin }}
        run: |
          created_at=$(node -p 'new Date().toISOString()')
          metadata_files=(
            "${EVIDENCE_DIR}/web.manifest.json"
            "${EVIDENCE_DIR}/api.manifest.json"
            "${EVIDENCE_DIR}/worker.manifest.json"
            "${EVIDENCE_DIR}/migrate.manifest.json"
          )
          expected_metadata=$(printf '%s\n' \
            api.manifest.json \
            migrate.manifest.json \
            web.manifest.json \
            worker.manifest.json)
          actual_metadata=$(find "$EVIDENCE_DIR" -maxdepth 1 -type f \
            -name '*.manifest.json' ! -name '*.oci-manifest.json' \
            -exec basename {} \; | sort)
          test "$actual_metadata" = "$expected_metadata"
          for target in web api worker migrate; do
            metadata="${EVIDENCE_DIR}/${target}.manifest.json"
            test -f "$metadata"
            test "$(jq -r '.target' "$metadata")" = "$target"
            test "$(jq -r '.image' "$metadata")" = "ghcr.io/zaman365/trevv-${target}"
          done
          jq -s \
            --arg sourceSha "$SOURCE_SHA" \
            --arg workflowSha "$GITHUB_SHA" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg createdAt "$created_at" \
            --arg publicOrigin "$PUBLIC_ORIGIN" \
            --arg cspMode "$CSP_MODE" \
            --arg hstsEnabled "$HSTS_ENABLED" \
            '{
              schemaVersion: 1,
              candidateId: ("staging-" + $sourceSha + "-" + env.GITHUB_RUN_ID + "-" + env.GITHUB_RUN_ATTEMPT),
              sourceSha: $sourceSha,
              publicationWorkflowSha: $workflowSha,
              workflowRun: $workflowRun,
              createdAt: $createdAt,
              platform: "linux/amd64",
              evidenceClass: "artifact-publication-only",
              deploymentPerformed: false,
              publicationProfile: {
                classification: "disposable-free-preview",
                intendedFreeWebServices: ["web", "api", "worker"],
                operatorRunOnly: ["migrate"],
                auxiliaryImages: [],
                excludedEvidence: [
                  "always-on-worker",
                  "high-availability",
                  "managed-backup-pitr",
                  "private-service-networking",
                  "production-readiness"
                ]
              },
              build: {
                publicOrigin: $publicOrigin,
                cspMode: $cspMode,
                hstsEnabled: ($hstsEnabled == "true")
              },
              images: (map({
                key: .target,
                value: {
                  image: .image,
                  tag: .tag,
                  digest: .digest,
                  reference: .reference,
                  provenance: .provenance,
                  verification: .verification
                }
              }) | from_entries)
            }' "${metadata_files[@]}" > "${OUTPUT_DIR}/staging-image-digests.json"
          jq -e '
            (.sourceSha | test("^[0-9a-f]{40}$")) and
            (.images | keys == ["api", "migrate", "web", "worker"]) and
            (.images | to_entries | all(
              .value.image == ("ghcr.io/zaman365/trevv-" + .key)
            )) and
            ([.images[].digest | test("^sha256:[0-9a-f]{64}$")] | all) and
            ([.images[].reference | contains("@sha256:")] | all) and
            ([.images[].provenance.url | type == "string" and length > 0] | all) and
            ([.images[].verification.status == "attested-security-gates-passed"] | all) and
            ([.images[].verification.githubProvenanceIssued == true] | all)
          ' "${OUTPUT_DIR}/staging-image-digests.json"
      - name: Generate the authenticated non-production successor manifest
        env:
          DIGEST_BUNDLE: ${{ runner.temp }}/staging-publication/staging-image-digests.json
          OUTPUT_DIR: ${{ runner.temp }}/staging-publication
          REHEARSAL_GIT_SHA: ${{ needs.verify-source.outputs.source_sha }}
          REHEARSAL_PREVIOUS_MANIFEST_PATH: ${{ steps.predecessor.outputs.manifest_path }}
          REHEARSAL_PREVIOUS_MANIFEST_SHA256: ${{ steps.predecessor.outputs.manifest_sha256 }}
          REHEARSAL_PREVIOUS_MIGRATION_HEAD: ${{ steps.predecessor.outputs.published_migration_head }}
          REHEARSAL_PREVIOUS_RELEASE_ID: ${{ steps.predecessor.outputs.release_id }}
          REHEARSAL_RELEASE_ID: rehearsal-candidate-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          test -z "$(git status --porcelain)"
          export TREV_API_IMAGE_ID
          export TREV_MIGRATE_IMAGE_ID
          export TREV_WEB_IMAGE_ID
          export TREV_WORKER_IMAGE_ID
          export REHEARSAL_CREATED_AT
          REHEARSAL_CREATED_AT=$(jq -r '.createdAt' "$DIGEST_BUNDLE")
          TREV_API_IMAGE_ID=$(jq -r '.images.api.digest' "$DIGEST_BUNDLE")
          TREV_MIGRATE_IMAGE_ID=$(jq -r '.images.migrate.digest' "$DIGEST_BUNDLE")
          TREV_WEB_IMAGE_ID=$(jq -r '.images.web.digest' "$DIGEST_BUNDLE")
          TREV_WORKER_IMAGE_ID=$(jq -r '.images.worker.digest' "$DIGEST_BUNDLE")
          node scripts/nonproduction-release-input.mjs \
            > "$RUNNER_TEMP/staging-successor-input.json"
          node scripts/phase6-release-manifest.mjs generate \
            --input "$RUNNER_TEMP/staging-successor-input.json" \
            --output "${OUTPUT_DIR}/staging-release-manifest.json"
          node scripts/phase6-release-manifest.mjs validate \
            --manifest "${OUTPUT_DIR}/staging-release-manifest.json"
          jq -e \
            --arg previousReleaseId "$REHEARSAL_PREVIOUS_RELEASE_ID" \
            --arg previousManifestDigest "$REHEARSAL_PREVIOUS_MANIFEST_SHA256" \
            --arg previousMigrationHead "$REHEARSAL_PREVIOUS_MIGRATION_HEAD" \
            '
              .previousRelease.releaseId == $previousReleaseId and
              .previousRelease.manifestDigest == $previousManifestDigest and
              .database.previousReleaseMigrationHead == $previousMigrationHead
            ' "${OUTPUT_DIR}/staging-release-manifest.json" >/dev/null
          test -z "$(git status --porcelain)"
      - name: Attest the digest bundle
        id: attest-bundle
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: ${{ runner.temp }}/staging-publication/staging-image-digests.json
      - name: Attest the non-production successor release manifest
        id: attest-release
        uses: actions/attest-build-provenance@00014ed6ed5efc5b1ab7f7f34a39eb55d41aa4f8 # v3.1.0
        with:
          subject-path: ${{ runner.temp }}/staging-publication/staging-release-manifest.json
      - name: Add publication provenance to the evidence set
        env:
          DIGEST_ATTESTATION_BUNDLE: ${{ steps.attest-bundle.outputs.bundle-path }}
          DIGEST_ATTESTATION_URL: ${{ steps.attest-bundle.outputs.attestation-url }}
          OUTPUT_DIR: ${{ runner.temp }}/staging-publication
          RELEASE_ATTESTATION_BUNDLE: ${{ steps.attest-release.outputs.bundle-path }}
          RELEASE_ATTESTATION_URL: ${{ steps.attest-release.outputs.attestation-url }}
        run: |
          test -f "$DIGEST_ATTESTATION_BUNDLE"
          test -f "$RELEASE_ATTESTATION_BUNDLE"
          cp "$DIGEST_ATTESTATION_BUNDLE" \
            "${OUTPUT_DIR}/staging-image-digests.provenance.bundle.json"
          cp "$RELEASE_ATTESTATION_BUNDLE" \
            "${OUTPUT_DIR}/staging-release-manifest.provenance.bundle.json"
          jq -n \
            --arg digestBundle "$DIGEST_ATTESTATION_URL" \
            --arg releaseManifest "$RELEASE_ATTESTATION_URL" \
            '{digestBundle: $digestBundle, releaseManifest: $releaseManifest}' \
            > "${OUTPUT_DIR}/staging-publication-attestations.json"
      - name: Upload the immutable candidate publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-image-digests-${{ needs.verify-source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/staging-publication/staging-image-digests.json
            ${{ runner.temp }}/staging-publication/staging-image-digests.provenance.bundle.json
            ${{ runner.temp }}/staging-publication/staging-publication-attestations.json
            ${{ runner.temp }}/staging-publication/staging-release-manifest.json
            ${{ runner.temp }}/staging-publication/staging-release-manifest.provenance.bundle.json
          if-no-files-found: error
          retention-days: 90
