name: TREVV CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: founderhq
          POSTGRES_PASSWORD: founderhq
          POSTGRES_DB: founderhq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U founderhq -d founderhq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://founderhq:founderhq@127.0.0.1:5432/founderhq_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-1234
      BETTER_AUTH_URL: http://127.0.0.1:8787
      WEB_ORIGIN: http://127.0.0.1:3100
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify formatting baseline
        run: pnpm format:check
      - name: Validate release-scope and claims registers
        run: |
          pnpm phase6:readiness
          pnpm phase6:claims
          pnpm test:phase6
      - name: Generate and verify API contract
        run: |
          pnpm contracts:generate
          git diff --exit-code -- openapi.json
      - name: Migrate and seed clean database
        run: |
          pnpm db:migrate
          pnpm db:seed
      - name: Verify persistent data plane in live mode
        env:
          DEMO_MODE: "false"
          TEST_DATABASE_URL: postgresql://founderhq:founderhq@127.0.0.1:5432/postgres
        run: pnpm test:integration
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Define a non-deployable production-build identity
        run: |
          build_digest=$(printf 'quality-build-only:%s:%s:%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -d ' ' -f 1)
          echo "RELEASE_ID=ci-build-only-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "RELEASE_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "RELEASE_IMAGE_ID=sha256:${build_digest}" >> "$GITHUB_ENV"
      - name: Build live-safe production artifacts
        env:
          NODE_ENV: production
          DEMO_MODE: "false"
          REGISTRATION_MODE: invite_only
          NEXT_PUBLIC_APP_URL: https://trevv.test
          API_ORIGIN: https://api.service.internal
          CSP_MODE: report-only
          HSTS_ENABLED: "false"
          RELEASE_METADATA_REQUIRED: "true"
        run: pnpm build
      - name: Enforce route and asset performance budgets
        run: pnpm performance:budget
      - name: Dependency security scan
        run: pnpm security:audit

  # e2e and accessibility run as independent gates so a failure in one
  # never hides the other's result.
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report
          retention-days: 14

  accessibility:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-a11y
          path: playwright-report
          retention-days: 14

  live-identity:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: founderhq
          POSTGRES_PASSWORD: founderhq
          POSTGRES_DB: founderhq_live_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U founderhq -d founderhq_live_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://founderhq:founderhq@127.0.0.1:5432/founderhq_live_e2e
      LIVE_E2E_DATABASE_URL: postgresql://founderhq:founderhq@127.0.0.1:5432/founderhq_live_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Verify live identity and tenant boundaries
        run: pnpm test:e2e:live
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-live-identity
          path: playwright-report
          retention-days: 14

  staging-topology:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Define the immutable candidate identity
        run: |
          echo "TREV_CANDIDATE_RELEASE_ID=ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "TREV_CANDIDATE_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build production-shaped service artifacts
        run: docker compose -f compose.staging.yaml --profile smoke build
      - name: Bind candidate services to the built Docker image IDs
        run: |
          api_id=$(docker compose -f compose.staging.yaml images -q api-1)
          worker_id=$(docker compose -f compose.staging.yaml images -q worker-1)
          web_id=$(docker compose -f compose.staging.yaml images -q web)
          migrate_id=$(docker compose -f compose.staging.yaml images -q migrate)
          test -n "$api_id"
          test -n "$worker_id"
          test -n "$web_id"
          test -n "$migrate_id"
          echo "TREV_API_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$api_id")" >> "$GITHUB_ENV"
          echo "TREV_WORKER_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$worker_id")" >> "$GITHUB_ENV"
          echo "TREV_WEB_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$web_id")" >> "$GITHUB_ENV"
          echo "TREV_MIGRATE_IMAGE_ID=$(docker image inspect --format '{{.Id}}' "$migrate_id")" >> "$GITHUB_ENV"
      - name: Start the live-mode topology
        run: >-
          docker compose -f compose.staging.yaml --profile smoke
          up --wait --wait-timeout 180 -d proxy worker-1 worker-2
      - name: Prove injected image IDs match the running containers
        run: |
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -f compose.staging.yaml ps -q api-1)")" = "$TREV_API_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -f compose.staging.yaml ps -q api-2)")" = "$TREV_API_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -f compose.staging.yaml ps -q worker-1)")" = "$TREV_WORKER_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -f compose.staging.yaml ps -q worker-2)")" = "$TREV_WORKER_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -f compose.staging.yaml ps -q web)")" = "$TREV_WEB_IMAGE_ID"
          test "$(docker inspect --format '{{.Image}}' "$(docker compose -f compose.staging.yaml ps --all -q migrate)")" = "$TREV_MIGRATE_IMAGE_ID"
      - name: Verify the host-published trusted TLS boundary
        run: |
          docker compose -f compose.staging.yaml cp proxy:/etc/trevv-local-tls/ca.crt /tmp/trevv-staging-ca.crt
          curl --fail --silent --show-error --cacert /tmp/trevv-staging-ca.crt https://127.0.0.1:8443/readyz
      - name: Prove failed upgrades clean their isolated database
        run: |
          if docker compose -f compose.staging.yaml --profile smoke run --rm -e STAGING_UPGRADE_FAILURE_INJECTION=after_previous_fixture upgrade-smoke; then
            echo "::error::The injected migration failure unexpectedly succeeded."
            exit 1
          fi
          remaining=$(docker compose -f compose.staging.yaml exec -T postgres psql -U founderhq -d postgres -Atc "select count(*) from pg_database where datname = 'trevv_previous_release_upgrade'")
          test "$remaining" = "0"
      - name: Verify previous-release database upgrade
        run: >-
          docker compose -f compose.staging.yaml --profile smoke
          run --rm upgrade-smoke
      - name: Smoke the complete topology
        run: >-
          docker compose -f compose.staging.yaml --profile smoke
          run --rm smoke
      - name: Prove proxy logs exclude query values
        run: |
          docker compose -f compose.staging.yaml --profile smoke logs --no-color proxy > /tmp/trevv-proxy.log
          node scripts/staging-proxy-log-check.mjs /tmp/trevv-proxy.log
      - name: Report topology state
        if: failure()
        run: |
          docker compose -f compose.staging.yaml --profile smoke ps --all
          docker compose -f compose.staging.yaml --profile smoke logs --no-color --tail=250
      - name: Remove topology resources (cleanup failures fail loudly)
        if: always()
        run: >-
          docker compose -f compose.staging.yaml --profile smoke
          down --volumes --remove-orphans

  # Production promotion is intentionally absent. The previous Web-only
  # Cloudflare deploy could publish a client without its API, worker, database,
  # mail, migration, and rollback cohort. Reintroduce automation only for one
  # reviewed release manifest that promotes and smokes the complete topology.
