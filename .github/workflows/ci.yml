name: TREVV CI

on:
  push:
    branches: [main, "feat/**", "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: founderhq
          POSTGRES_PASSWORD: founderhq
          POSTGRES_DB: founderhq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U founderhq -d founderhq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://founderhq:founderhq@127.0.0.1:5432/founderhq_test
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-1234
      BETTER_AUTH_URL: http://127.0.0.1:8787
      WEB_ORIGIN: http://127.0.0.1:3100
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate and verify API contract
        run: |
          pnpm contracts:generate
          git diff --exit-code -- openapi.json
      - name: Migrate and seed clean database
        run: |
          pnpm db:migrate
          pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency security scan
        run: pnpm security:audit

  # e2e and accessibility run as independent gates so a failure in one
  # never hides the other's result.
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report
          retention-days: 14

  accessibility:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:a11y
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-a11y
          path: playwright-report
          retention-days: 14

  # Production deploys only from main, and only once every gate is green.
  # Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets on
  # a protected "production" environment; without them this job cannot run.
  #
  # Rollback: pnpm --filter @founderhq/web exec wrangler rollback
  # or target a specific version:
  #   pnpm --filter @founderhq/web exec wrangler rollback <version-id>
  # List candidates with:
  #   pnpm --filter @founderhq/web exec wrangler deployments list
  deploy:
    runs-on: ubuntu-latest
    needs: [quality, e2e, accessibility]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://trevv.de
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and deploy the Worker
        run: pnpm --filter @founderhq/web deploy:cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://trevv.de/app/portfolio)
          echo "trevv.de/app/portfolio -> $code"
          test "$code" = "200"
      - name: Report failure
        if: failure()
        run: |
          echo "::error::Production deploy failed. Roll back with:" \
            "pnpm --filter @founderhq/web exec wrangler rollback"
          exit 1
