name: Retry Worker navigation
on:
  workflow_dispatch:
    inputs:
      source_ci_run_id:
        description: Completed CI run where only the Worker navigation step failed
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  navigation:
    name: Worker navigation retry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: Verify retained checks and unchanged application
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CI_RUN_ID: ${{ inputs.source_ci_run_id }}
        run: node scripts/verify-navigation-retry.mjs source
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.22.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run production Worker navigation checks
        run: pnpm test:worker-navigation
      - name: Retain retry evidence and server diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-navigation-retry-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            navigation-retry-evidence.json
            /tmp/trevv-worker-navigation.log
            /tmp/trevv-worker-navigation-build.log
          retention-days: 14
